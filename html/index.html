<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZFundry - Fonderie & Bijouterie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════════
         UI CRAFTING (Fonderie/Bijouterie)
         ═══════════════════════════════════════════════════════════════ -->
    <div id="craftingUI" class="ui-container" style="display: none;">
        <div class="ui-wrapper">
            <div class="ui-header">
                <h1 class="ui-title" id="craftingTitle">🔥 Fonderie</h1>
                <button class="close-btn" onclick="closeAllUIs()">✕</button>
            </div>
            <div class="ui-content">
                <div class="recipes-grid" id="recipesGrid"></div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         UI GARAGE
         ═══════════════════════════════════════════════════════════════ -->
    <div id="garageUI" class="ui-container" style="display: none;">
        <div class="ui-wrapper">
            <div class="ui-header">
                <h1 class="ui-title">🚗 Garage</h1>
                <button class="close-btn" onclick="closeAllUIs()">✕</button>
            </div>
            <div class="ui-content">
                <div class="garage-actions">
                    <button class="btn-garage" onclick="storeVehicle()">🅿️ Ranger le véhicule</button>
                </div>
                <div class="vehicles-list" id="vehiclesList"></div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         UI EXPORT
         ═══════════════════════════════════════════════════════════════ -->
    <div id="exportUI" class="ui-container" style="display: none;">
        <div class="ui-wrapper">
            <div class="ui-header">
                <h1 class="ui-title">📦 Exportation</h1>
                <button class="close-btn" onclick="closeAllUIs()">✕</button>
            </div>
            <div class="ui-content">
                <div class="export-grid" id="exportGrid"></div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         MODAL QUANTITÉ
         ═══════════════════════════════════════════════════════════════ -->
    <div id="quantityModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 class="modal-title" id="modalItemLabel">Item</h2>

            <div class="quantity-selector">
                <button class="qty-btn" onclick="decreaseQuantity()">-</button>
                <input type="number" class="qty-input" id="quantityInput" value="1" min="1" max="999">
                <button class="qty-btn" onclick="increaseQuantity()">+</button>
            </div>

            <div class="ingredients-required" id="ingredientsRequired"></div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeQuantityModal()">Annuler</button>
                <button class="btn-confirm" onclick="confirmAction()">Confirmer</button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         BARRE DE PROGRESSION
         ═══════════════════════════════════════════════════════════════ -->
    <div id="progressBar" class="progress-bar-container" style="display: none;">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         NOTIFICATIONS
         ═══════════════════════════════════════════════════════════════ -->
    <div id="notificationContainer" class="notification-container"></div>

    <script src="script.js"></script>
</body>
</html>
