<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZFundry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="foundryUI" class="ui-container" style="display: none;">
        <div class="ui-wrapper">
            <div class="ui-header">
                <h1 class="ui-title">
                    <span class="icon">🔥</span>
                    <span id="menuTitle">Fonderie</span>
                </h1>
                <button class="close-btn" onclick="closeUI()">✕</button>
            </div>

            <div class="ui-content">
                <div class="recipes-grid" id="recipesGrid">
                    <!-- Les recettes seront injectées ici -->
                </div>
            </div>

            <div class="ui-footer">
                <p class="hint">Cliquez sur une recette pour fabriquer</p>
            </div>
        </div>
    </div>

    <!-- Modal de quantité -->
    <div id="quantityModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Quantité à fabriquer</h2>
                <button class="close-btn" onclick="closeQuantityModal()">✕</button>
            </div>
            <div class="modal-body">
                <p id="recipeLabel" class="recipe-label"></p>
                <div class="quantity-controls">
                    <button class="qty-btn" onclick="decreaseQuantity()">-</button>
                    <input type="number" id="quantityInput" value="1" min="1" max="999">
                    <button class="qty-btn" onclick="increaseQuantity()">+</button>
                </div>
                <div class="ingredients-required" id="ingredientsRequired"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeQuantityModal()">Annuler</button>
                <button class="btn btn-confirm" onclick="confirmCraft()">Fabriquer</button>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notificationContainer" class="notification-container"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
